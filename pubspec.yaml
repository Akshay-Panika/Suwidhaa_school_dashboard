name: suwidhaa_school_dashboard
description: "Suwidhaa School Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.3

  # API
  dio: ^5.11.0

  # Local Storage
  shared_preferences: ^2.5.5

  # Date & Time Formatting
  intl: ^0.20.2

  # Toast Messages
  fluttertoast: ^8.2.12

  # File Upload / File Picker
  file_picker: ^10.3.10

  # Loading Effect
  shimmer: ^3.0.0

  # Open URLs / Phone / Email
  url_launcher: ^6.3.2

  firebase_core: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # Uncomment this when you add assets
  # :
  #   - assets/images/
  #   - assets/icons/